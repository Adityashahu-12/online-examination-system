databases:
  - name: examhub-postgres
    databaseName: online_examination_system_portal
    user: examhub_admin
    plan: free
    region: oregon

services:
  - type: web
    name: examhub-online-exam-system
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: examhub-postgres
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@examhub.local
      - key: ADMIN_PASSWORD
        value: Admin@123
