databases:
  - name: examhub-postgres
    databaseName: online_examination_system
    user: examhub_admin
    plan: free
    region: oregon

services:
  - type: web
    name: examhub-online-exam-system
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn server:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: examhub-postgres
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FLASK_ENV
        value: production

